<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Bridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ink: { 950: '#070b14', 900: '#0b1220', 800: '#121a2b', 700: '#1a2438', 600: '#243049' },
            accent: { DEFAULT: '#3b82f6', soft: '#1d4ed8' },
          },
          fontFamily: {
            sans: ['ui-sans-serif', 'system-ui', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/assets/captcha.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    html, body { height: 100%; }
    body { background: radial-gradient(900px 480px at 12% -8%, #152038, transparent), #070b14; }
    .msg-md pre { background: #0a1220; border: 1px solid #243049; border-radius: 8px; padding: 10px 12px; overflow: auto; }
    .msg-md code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }
    .msg-md p { margin: 0.45em 0; }
    .msg-md ul, .msg-md ol { margin: 0.4em 0; padding-left: 1.35em; }
    .msg-md a { color: #7dd3fc; }
    .msg-md h1,.msg-md h2,.msg-md h3 { font-weight: 650; margin: 0.7em 0 0.35em; }
    .scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #243049; border-radius: 8px; }
  </style>
</head>
<body class="text-slate-100 font-sans antialiased">
  <div id="app" class="min-h-full"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
